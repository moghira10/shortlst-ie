<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Top wave shape -->
  <path
    d="M0 15
       C10 0, 30 0, 40 15
       C50 30, 70 30, 80 15
       C90 0, 100 0, 110 15
       L110 30
       C100 15, 80 15, 70 30
       C60 45, 40 45, 30 30
       C20 15, 0 15, 0 15
       Z"
    fill="url(#waveGradient)" />

  <!-- Bottom wave shape -->
  <path
    d="M0 45
       C10 30, 30 30, 40 45
       C50 60, 70 60, 80 45
       C90 30, 100 30, 110 45
       L110 60
       C100 45, 80 45, 70 60
       C60 75, 40 75, 30 60
       C20 45, 0 45, 0 45
       Z"
    fill="url(#waveGradient)" />
</svg>